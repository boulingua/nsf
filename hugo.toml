# ─────────────────────────────────────────────────────────────────────────
# nsf — Norsk som fremmedspråk, instantiated from the pagegen template.
#
# Only the values pagegen marks as per-course are changed here; everything
# else is the shared boulingua standard and stays as the template ships it.
# The course variety is Bokmål (see ROADMAP §2); `languageCode = "nb"`
# selects Norwegian Bokmål date/number formatting.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/nsf/"
title = "Norsk som fremmedspråk — S. Le Boulanger"
languageCode = "nb"
defaultContentLanguage = "nb"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Norsk"
  author = "S. Le Boulanger"
  description = "A free Norwegian (Bokmål) course from A1 to B1 — CEFR-aligned units, model exams, open-format classroom materials and native-voice audio."
  keywords = "norsk,bokmål,CEFR,curriculum,OER,norwegian"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent (#6D8618 / #CEE77E) from
  # data/accents.yaml. Never edit CSS to change the accent.
  code = "nsf"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany), as on the sister sites; disclosed in
    # /datenschutz/. Each site counts as its own property via data-domain.
    domain = "boulingua.github.io/nsf"
    # script.file-downloads.outbound-links.js additionally counts .pdf/.odp
    # downloads and outbound clicks — the numbers the deck/worksheet planning
    # and the VG Wort work planning actually rely on. Both variants are
    # cookieless and PII-free. Use "script.js" for the plain default.
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/nsf"

